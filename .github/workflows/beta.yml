name: Beta build

# A vX.Y.Z-beta.N tag becomes a GitHub pre-release and nothing else (issue #11,
# ADR-0017). The stores keep shipping the Anniversary TOC through release.yml and
# publish.yml: this job never runs them, never pushes to main, and only edits the
# TOC and the version constant inside its own checkout.
on:
  push:
    tags:
      - 'v*.*.*-beta.*'

permissions:
  contents: write

jobs:
  beta:
    name: Package the beta pre-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Keeps the job token out of .git/config, so no later step (the third-party
          # packager included) can push with it; gh gets it through GH_TOKEN only.
          persist-credentials: false

      - name: Stamp the beta version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The interfaces are committed now (issue #20), Anniversary first so it shows
          # no out-of-date warning on it. A TOC that lost Forever's would ship a zip the
          # beta client will not load, so it fails here instead.
          grep -qE '^## Interface: [0-9]+, 16001$' GuildOS.toc
          sed -i "s/^## Version: .*/## Version: ${VERSION}/" GuildOS.toc
          sed -i -E "s/^(GuildOS\.VERSION[[:space:]]*=[[:space:]]*)\"[^\"]*\"/\1\"${VERSION}\"/" Core/Config.lua
          grep -E '^## (Interface|Version):' GuildOS.toc
          grep -E '^GuildOS\.VERSION' Core/Config.lua

      - name: Package without uploading anywhere
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2
        with:
          args: -d

      - name: Create the GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" .release/GuildOS-*.zip \
            --prerelease \
            --title "GuildOS ${GITHUB_REF_NAME} (WoW: Forever beta)" \
            --notes "Beta build for testing on the WoW: Forever beta. Not published to CurseForge or Wago. Install and test steps: README, \"Testing on the Forever beta\"."
